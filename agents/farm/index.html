<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Farm</title>
<style>
:root {
  --sky-top: #8ecdf2; --sky-bottom: #d9f0fb;
  --grass: #7cbf5a; --grass-dark: #5e9f40; --soil: #a8794f; --soil-dark: #8a6039;
  --fence: #c99a63; --ink: #2f2a22; --muted: #6c6355; --card: #fffaf0; --line: #e7dcc7;
  --working: #2f9e44; --idle: #868e96; --blocked: #e03131; --accent: #e8590c;
  --font: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, sans-serif;
}
:root[data-sky="dusk"] { --sky-top: #f4a261; --sky-bottom: #fde2c0; }
:root[data-sky="night"] {
  --sky-top: #1d2b53; --sky-bottom: #3b4a7a; --grass: #3f6e33; --grass-dark: #2f5426;
  --soil: #6b4f35; --soil-dark: #574029; --card: #232019; --ink: #f1ead9; --muted: #b8ad98;
  --line: #3d372c; --fence: #8c6c48;
}
* { box-sizing: border-box; }
html { background: var(--grass); }
body { margin: 0; font-family: var(--font); color: var(--ink);
  background: linear-gradient(var(--sky-top), var(--sky-bottom) 260px, var(--grass) 260px) fixed; min-height: 100vh; }
header { padding: 20px 16px 8px; max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap;
  align-items: center; gap: 12px; }
h1 { margin: 0; font-size: 28px; letter-spacing: .5px; text-shadow: 0 1px 0 rgba(255,255,255,.5); }
:root[data-sky="night"] h1 { text-shadow: none; }
.sun { font-size: 34px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; }
.chip { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px;
  font-size: 13px; color: var(--muted); }
.chip b { color: var(--ink); }
.chip.alert { border-color: var(--blocked); color: var(--blocked); }
button.chip { font: inherit; font-size: 13px; cursor: pointer; }
button.chip:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
button.chip:hover b { color: #fff; }
.flash { animation: flash 1.6s ease-out 1; border-radius: 12px; }
@keyframes flash { 0%, 40% { box-shadow: 0 0 0 6px #ffd43b; } 100% { box-shadow: 0 0 0 0 transparent; } }
.who .mail { position: absolute; top: -6px; left: -2px; font-size: 13px; background: #fff; border-radius: 8px;
  padding: 0 4px; color: #2f2a22; font-weight: 800; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
main { max-width: 1200px; margin: 0 auto; padding: 8px 16px 48px; display: grid; gap: 22px; }
.empty { background: var(--card); border-radius: 16px; padding: 32px; text-align: center; color: var(--muted); }

/* copilot quota */
.quota { max-width: 1200px; margin: 0 auto; padding: 0 16px 8px; }
.quota-card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px 14px;
  display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: center; font-size: 13px; }
.quota-card .what { font-weight: 800; }
.qbar { position: relative; height: 12px; border-radius: 6px; background: rgba(0,0,0,.08); overflow: visible; }
:root[data-sky="night"] .qbar { background: rgba(255,255,255,.1); }
.qbar i { display: block; height: 100%; border-radius: 6px; background: var(--working); }
.qbar.warn i { background: #f59f00; } .qbar.over i { background: var(--blocked); }
.qbar .pace { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); opacity: .7; }
.quota-card .note { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
@media (max-width: 600px) { .quota-card { grid-template-columns: 1fr; } }

/* needs-you board */
.needs { background: #fff4e6; color: #2f2a22; border-bottom: 3px solid var(--accent); padding: 10px 14px; display: grid; gap: 8px; }
.needs h3 { margin: 0; font-size: 14px; color: var(--accent); }
.ask { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 13px; }
.ask .id { font-weight: 800; color: var(--accent); }
.ask .meta { grid-column: 2; color: #6c6355; font-size: 12px; }
.ask .p1 { color: var(--blocked); }

.allneeds { background: #fff4e6; color: #2f2a22; border: 3px solid var(--accent); border-radius: 16px; padding: 12px 14px;
  display: grid; gap: 8px; box-shadow: 0 4px 0 rgba(0,0,0,.08); }
.allneeds h2 { margin: 0 0 2px; font-size: 18px; color: var(--accent); }
.need { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 10px; align-items: start; font-size: 13.5px;
  padding: 8px 0; border-top: 1px dashed #f0c9a5; }
.need:first-of-type { border-top: 0; }
.need .tag { font-weight: 800; color: var(--accent); white-space: nowrap; }
.need .tag.p1 { color: var(--blocked); }
.need .meta { grid-column: 2; color: #6c6355; font-size: 12px; white-space: pre-wrap; }
.need .go { grid-row: 1 / span 2; grid-column: 3; }
.btn { font: inherit; font-size: 12px; font-weight: 700; border-radius: 999px; border: 2px solid var(--accent);
  background: #fff; color: var(--accent); padding: 4px 12px; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--accent); color: #fff; }
.btn.quiet { border-color: var(--line); color: var(--muted); background: var(--card); }
.allclear { background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 10px 14px;
  font-size: 14px; color: var(--muted); }

/* a space = a field */
.field { background: var(--grass); border-radius: 20px; overflow: hidden; border: 3px solid var(--grass-dark);
  box-shadow: 0 6px 0 var(--grass-dark); }
.field-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px;
  background: linear-gradient(var(--grass-dark), var(--grass)); color: #fff; }
.field-head h2 { margin: 0; font-size: 18px; }
.field-head .sub { font-size: 12px; opacity: .85; }
.field-body { display: grid; grid-template-columns: minmax(150px, 210px) 1fr; gap: 14px; padding: 14px; }
@media (max-width: 720px) { .field-body { grid-template-columns: 1fr; } }

.farmhouse { background: var(--card); border-radius: 14px; border: 2px solid var(--line); padding: 12px;
  display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.house { font-size: 54px; line-height: 1; }
.plots { display: flex; flex-wrap: wrap; gap: 14px; align-content: flex-start; }
.fallow { color: #fff; opacity: .85; font-size: 14px; padding: 18px; }

/* a farmer's plot: fenced soil with crop rows */
.plot { position: relative; flex: 1 1 260px; max-width: 420px; min-height: 170px; border-radius: 12px;
  border: 4px dashed var(--fence);
  background: repeating-linear-gradient(0deg, var(--soil) 0 14px, var(--soil-dark) 14px 18px);
  padding: 10px 10px 12px; }
.sign { background: var(--card); border: 2px solid var(--fence); border-radius: 8px; padding: 5px 9px;
  font-size: 12px; font-weight: 700; display: inline-block; max-width: 100%; box-shadow: 0 2px 0 var(--fence); }
.sign small { display: block; font-weight: 400; color: var(--muted); }
.crew { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px; margin-top: 12px; }

/* characters */
.who { position: relative; background: none; border: 0; padding: 4px 4px 0; cursor: pointer; color: inherit;
  font: inherit; display: flex; flex-direction: column; align-items: center; gap: 2px; border-radius: 10px; }
.who:hover, .who:focus-visible { background: rgba(255,255,255,.25); outline: none; }
.who .sprite { font-size: 40px; line-height: 1; display: inline-block; }
.who.small .sprite { font-size: 30px; }
.who .name { font-size: 11px; font-weight: 700; background: rgba(255,250,240,.92); color: #2f2a22;
  border-radius: 6px; padding: 1px 6px; max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who .bubble { position: absolute; top: -6px; right: -4px; font-size: 16px; }
.who.working .sprite { animation: bob .9s ease-in-out infinite; }
.who.working.small .sprite { animation: trot 1.4s ease-in-out infinite; }
.who.idle .sprite, .who.done .sprite { filter: saturate(.7); }
.who.idle .bubble, .who.done .bubble { animation: float 2.6s ease-in-out infinite; }
.who.blocked .bubble { animation: pulse .8s ease-in-out infinite; }
.who.blocked .name { background: var(--blocked); color: #fff; }
@keyframes bob { 50% { transform: translateY(-5px) rotate(-4deg); } }
@keyframes trot { 0%,100% { transform: translateX(0) } 50% { transform: translateX(6px) scaleX(-1); } }
@keyframes float { 0% { opacity: 0; transform: translate(0,4px); } 40% { opacity: 1; } 100% { opacity: 0; transform: translate(6px,-12px); } }
@keyframes pulse { 50% { transform: scale(1.35); } }
@media (prefers-reduced-motion: reduce) { .who .sprite, .who .bubble { animation: none !important; } }

/* hay bale = context meter */
.hay { width: 46px; height: 6px; border-radius: 3px; background: rgba(0,0,0,.25); overflow: hidden; }
.hay i { display: block; height: 100%; background: #f2c94c; }
.hay.high i { background: #e8590c; }

/* drawer */
.drawer { position: fixed; inset: 0 0 0 auto; width: min(560px, 100vw); background: var(--card); color: var(--ink);
  border-left: 1px solid var(--line); box-shadow: -8px 0 24px rgba(0,0,0,.18); transform: translateX(105%);
  transition: transform .2s ease; display: flex; flex-direction: column; z-index: 10; }
.drawer.open { transform: none; }
.drawer header { padding: 16px; border-bottom: 1px solid var(--line); margin: 0; max-width: none; }
.drawer .big { font-size: 42px; }
.drawer h3 { margin: 0; font-size: 18px; }
.drawer .close { margin-left: auto; font-size: 22px; background: none; border: 0; cursor: pointer; color: var(--ink); }
.drawer .content { padding: 14px 16px; overflow: auto; display: grid; gap: 12px; }
.kv { display: grid; grid-template-columns: 120px 1fr; gap: 4px 10px; font-size: 13px; }
.kv div:nth-child(odd) { color: var(--muted); }
.box { background: rgba(0,0,0,.04); border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-size: 13px;
  white-space: pre-wrap; word-break: break-word; }
:root[data-sky="night"] .box { background: rgba(255,255,255,.04); }
.chat { display: grid; gap: 8px; max-height: 46vh; overflow: auto; padding: 4px 2px; }
.msg { max-width: 88%; padding: 7px 10px; border-radius: 12px; font-size: 13px; white-space: pre-wrap; word-break: break-word; }
.msg.you { justify-self: end; background: #d3f9d8; color: #1b3a1f; border-bottom-right-radius: 3px; }
.msg.them { justify-self: start; background: rgba(0,0,0,.05); border: 1px solid var(--line); border-bottom-left-radius: 3px; }
:root[data-sky="night"] .msg.you { background: #2b5a33; color: #e9f7ec; }
:root[data-sky="night"] .msg.them { background: rgba(255,255,255,.05); }
.msg small { display: block; font-size: 11px; color: var(--muted); margin-bottom: 2px; }
details.screenbox summary { cursor: pointer; }
pre.screen { margin: 0; font: 11.5px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace; max-height: 46vh; overflow: auto; }
.label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
.status-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
.updated { font-size: 12px; color: var(--muted); padding: 0 16px 10px; max-width: 1200px; margin: 0 auto; }
</style>
</head>
<body>
<header>
  <span class="sun" id="sun" aria-hidden="true">☀️</span>
  <h1>The Farm</h1>
  <div class="chips" id="chips"></div>
  <button class="btn quiet" id="notify" type="button">🔔 Notify me</button>
</header>
<div class="quota" id="quota"></div>
<div class="updated" id="updated">Loading the farm…</div>
<main id="farm"></main>

<aside class="drawer" id="drawer" aria-live="polite">
  <header>
    <span class="big" id="d-sprite"></span>
    <div><h3 id="d-name"></h3><div class="label" id="d-kind"></div></div>
    <button class="close" id="d-close" aria-label="Close">✕</button>
  </header>
  <div class="content" id="d-content"></div>
</aside>

<script>
const SPRITES = { leadfarmer: "👩‍🌾", farmer: "🧑‍🌾", farmhand: "🧑‍🔧",
  horse: "🐴", dog: "🐕", goose: "🪿", cow: "🐄", pig: "🐖", sheep: "🐑", goat: "🐐", chicken: "🐔",
  rooster: "🐓", duck: "🦆", rabbit: "🐇", donkey: "🫏", llama: "🦙", bee: "🐝", turkey: "🦃", cat: "🐈",
  owl: "🦉", ox: "🐂", mouse: "🐁", hedgehog: "🦔", bison: "🦬", fox: "🦊", frog: "🐸", snail: "🐌" };
const ROLE_NAME = { worker: "worker", researcher: "researcher", reviewer: "reviewer" };
function kindLabel(a) {
  if (a.kind === "leadfarmer") return "Lead farmer";
  if (a.kind === "farmer") return "Farmer";
  if (a.kind === "farmhand") return "Farmhand · started by you";
  const animal = a.kind.charAt(0).toUpperCase() + a.kind.slice(1);
  return [animal, a.specialty, ROLE_NAME[a.role]].filter(Boolean).join(" · ");
}
const BUBBLE = { working: "", idle: "💤", done: "💤", blocked: "❗", unknown: "❔" };
let state = null, openName = null, detailTimer = null;
const TOKEN = "__FARM_TOKEN__";
const PAGE_VERSION = "__FARM_VERSION__";
const KIND_TAG = { decision: "", dialog: "Dialog", draft: "Draft", down: "Down" };
let seenNeeds = null;
function needKey(n, s) { return `${s.id}|${n.kind}|${n.id}`; }
function needRow(n, s, showField) {
  const tag = n.kind === "decision" ? `${n.id} ${n.priority}` : `${KIND_TAG[n.kind]} ${n.priority}`;
  const where = showField ? `${esc(s.label)} · ` : "";
  return `<div class="need"><span class="tag ${n.priority === "P1" ? "p1" : ""}">${esc(tag)}</span>
    <span>${esc(n.text)}</span>
    ${n.focus ? `<span class="go"><button class="btn" data-focus="${esc(n.focus)}">Show me</button></span>` : `<span></span>`}
    <span class="meta">${where}from ${esc(n.from)}${n.since ? " · " + ago(n.since) : ""}${n.detail ? "\n" + esc(n.detail) : ""}</span></div>`;
}
async function focusAgent(name) {
  const r = await fetch(`/api/focus/${encodeURIComponent(name)}`, { method: "POST", headers: { "X-Farm-Token": TOKEN } });
  if (!r.ok) alert(`Could not switch herdr to ${name}.`);
}
function notifyNew(spaces) {
  const all = spaces.flatMap(s => (s.needs || []).map(n => [needKey(n, s), n, s]));
  const keys = new Set(all.map(x => x[0]));
  if (seenNeeds && localStorageGet("farm-notify") === "on" && "Notification" in window && Notification.permission === "granted") {
    for (const [k, n, s] of all) if (!seenNeeds.has(k)) new Notification(`🌾 ${s.label}: needs you`, { body: n.text, tag: k });
  }
  seenNeeds = keys;
}
function localStorageGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function localStorageSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function paintNotifyButton() {
  const on = localStorageGet("farm-notify") === "on" && "Notification" in window && Notification.permission === "granted";
  const b = document.getElementById("notify");
  b.textContent = on ? "🔔 Notifications on" : "🔕 Notify me";
  b.classList.toggle("quiet", !on);
}

function sky() {
  const h = new Date().getHours();
  const mode = h >= 20 || h < 6 ? "night" : (h >= 17 || h < 8) ? "dusk" : "day";
  document.documentElement.dataset.sky = mode;
  document.getElementById("sun").textContent = mode === "night" ? "🌙" : mode === "dusk" ? "🌅" : "☀️";
}
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function ago(ts) {
  if (!ts) return "never";
  const s = Math.max(0, Date.now() / 1000 - ts);
  return s < 60 ? `${Math.round(s)}s ago` : s < 3600 ? `${Math.round(s / 60)}m ago` : `${Math.round(s / 3600)}h ago`;
}
function hay(a) {
  if (!a.context_tokens || !a.context_window) return "";
  const pct = Math.min(100, Math.round(100 * a.context_tokens / a.context_window));
  return `<span class="hay ${pct >= 40 ? "high" : ""}" title="context ${pct}%"><i style="width:${pct}%"></i></span>`;
}
function who(a, small) {
  const st = a.status || "unknown";
  return `<button class="who ${small ? "small" : ""} ${st}" data-name="${esc(a.name)}"
            title="${esc(kindLabel(a))}: ${esc(a.title || a.name)} (${st})">
    <span class="bubble">${BUBBLE[st] ?? ""}</span>
    ${a.waiting ? `<span class="mail" title="${a.waiting} message(s) waiting for this agent">📬${a.waiting}</span>` : ""}
    <span class="sprite" aria-hidden="true">${SPRITES[a.kind] || "🐾"}</span>
    <span class="name">${esc(a.title || a.name)}</span>${hay(a)}</button>`;
}
function render() {
  const farm = document.getElementById("farm");
  const spaces = state.spaces;
  const all = spaces.flatMap(s => [s.lead_farmer, ...s.farmers, ...s.farmers.flatMap(f => f.animals), ...s.loose].filter(Boolean));
  const working = all.filter(a => a.status === "working").length;
  const blocked = all.filter(a => a.status === "blocked").length;
  const waiting = spaces.reduce((n, s) => n + (s.waiting_messages || 0), 0);
  const needCount = spaces.reduce((n, s) => n + (s.needs || []).length, 0);
  document.getElementById("chips").innerHTML =
    `<span class="chip"><b>${spaces.length}</b> fields</span>` +
    `<span class="chip"><b>${spaces.reduce((n, s) => n + s.farmers.length, 0)}</b> farmers</span>` +
    `<span class="chip"><b>${spaces.reduce((n, s) => n + s.farmers.reduce((m, f) => m + f.animals.length, 0) + s.loose.length, 0)}</b> animals</span>` +
    `<span class="chip"><b>${working}</b> at work</span>` +
    (needCount ? `<button class="chip alert" data-goto="needs" title="Go to what needs you"><b>${needCount}</b> need you</button>` : "") +
    (blocked ? `<button class="chip alert" data-goto="needs" title="Go to what needs you"><b>${blocked}</b> blocked on a dialog</button>` : "") +
    (waiting ? `<button class="chip" data-goto="mail" title="Go to who the messages are for"><b>${waiting}</b> messages waiting</button>` : "");
  const needs = spaces.flatMap(s => (s.needs || []).map(n => ({ n, s })))
    .sort((a, b) => a.n.priority.localeCompare(b.n.priority) || (a.n.since || 0) - (b.n.since || 0));
  document.title = needs.length ? `(${needs.length}) The Farm` : "The Farm";
  notifyNew(spaces);
  if (!spaces.length) { farm.innerHTML = `<div class="empty">No fields yet. Open a herdr space to plant one.</div>`; return; }
  const top = needs.length
    ? `<section class="allneeds" id="needs" aria-label="Needs you"><h2>🔔 Needs you (${needs.length})</h2>
         ${needs.map(x => needRow(x.n, x.s, true)).join("")}
         <div class="meta" style="color:#6c6355;font-size:12px">Answer decisions in the lead farmer's pane, for example "D2 yes". Show me switches herdr to the right pane.</div></section>`
    : `<div class="allclear">✅ Nothing needs you right now.</div>`;
  farm.innerHTML = top + spaces.map(s => `
    <section class="field" aria-label="${esc(s.label)}">
      <div class="field-head"><h2>🌾 ${esc(s.label)}</h2><span class="sub">${esc(s.cwd || "")}</span></div>
      ${(s.needs || []).length ? `<div class="needs"><h3>🔔 Needs you</h3>
        ${[...s.needs].sort((a, b) => a.priority.localeCompare(b.priority)).map(n => needRow(n, s, false)).join("")}
        </div>` : ""}
      <div class="field-body">
        <div class="farmhouse">
          <div class="house" aria-hidden="true">🏡</div>
          ${s.lead_farmer ? who(s.lead_farmer) : `<div class="label">no lead farmer</div>`}
          ${s.waiting_messages ? `<div class="label">📬 ${s.waiting_messages} waiting</div>` : ""}
        </div>
        <div class="plots">
          ${s.farmers.map(f => `
            <div class="plot">
              <div class="sign">${esc(f.title || f.name)}<small>${esc(f.name)} · ${esc(f.vendor || "")} ${esc(f.model || "")}</small></div>
              <div class="crew">${who(f)}${f.animals.map(a => who(a, true)).join("")}</div>
            </div>`).join("")}
          ${s.loose.length ? `<div class="plot"><div class="sign">Roaming<small>not tied to a farmer</small></div>
              <div class="crew">${s.loose.map(a => who(a, a.kind !== "farmhand")).join("")}</div></div>` : ""}
          ${!s.farmers.length && !s.loose.length ? `<div class="fallow">This field is fallow. No farmers yet.</div>` : ""}
        </div>
      </div>
    </section>`).join("");
  document.getElementById("updated").textContent = `Live · updated ${new Date(state.generated * 1000).toLocaleTimeString()}`;
}
async function refresh() {
  try {
    const r = await fetch("/api/farm", { cache: "no-store" });
    state = await r.json();
    if (state.page_version && state.page_version !== PAGE_VERSION) { location.reload(); return; }  // the farm page was updated
    render();
  } catch (e) { document.getElementById("updated").textContent = "Lost contact with the farm. Retrying…"; }
}
async function openDetail(name) {
  openName = name;
  const d = document.getElementById("drawer"); d.classList.add("open");
  clearInterval(detailTimer); await loadDetail(); detailTimer = setInterval(loadDetail, 3000);
}
async function loadDetail() {
  if (!openName) return;
  const r = await fetch(`/api/agent/${encodeURIComponent(openName)}`, { cache: "no-store" });
  const a = await r.json();
  document.getElementById("d-sprite").textContent = SPRITES[a.kind] || "🐾";
  document.getElementById("d-name").textContent = a.title || a.name;
  document.getElementById("d-kind").textContent = `${kindLabel(a)} · ${a.name}`;
  const content = document.getElementById("d-content");
  // keep the reader's place: skip identical refreshes and refreshes while text is selected
  const sel = window.getSelection();
  if (sel && sel.toString() && content.contains(sel.anchorNode)) return;
  const sig = JSON.stringify([a.status, a.last_report, a.context_tokens, a.compactions, a.screen, a.last_report_text,
                              (a.conversation || []).length, a.unread_reports]);
  const oldChat = content.querySelector(".chat");
  const chatAtBottom = !oldChat || oldChat.scrollHeight - oldChat.scrollTop - oldChat.clientHeight < 8;
  const chatTop = oldChat ? oldChat.scrollTop : 0;
  if (content.dataset.name === a.name && content.dataset.sig === sig) return;
  const oldPre = content.querySelector("pre.screen");
  const sameAgent = content.dataset.name === a.name;
  const preTop = oldPre ? oldPre.scrollTop : 0;
  const atBottom = !oldPre || oldPre.scrollHeight - oldPre.scrollTop - oldPre.clientHeight < 8;
  const contentTop = content.scrollTop;
  content.dataset.name = a.name; content.dataset.sig = sig;
  const color = { working: "var(--working)", blocked: "var(--blocked)" }[a.status] || "var(--idle)";
  const ctx = a.context_tokens ? `${Math.round(a.context_tokens / 1000)}k / ${Math.round(a.context_window / 1000)}k` : "unknown";
  document.getElementById("d-content").innerHTML = `
    <div class="kv">
      <div>Status</div><div><span class="status-dot" style="background:${color}"></span>${esc(a.status)}</div>
      <div>Reports to</div><div>${esc(a.parent || "you")}</div>
      <div>Model</div><div>${esc([a.vendor, a.model, a.effort && a.effort + " effort", a.tier && a.tier + " tier"].filter(Boolean).join(" · "))}</div>
      <div>Context</div><div>${ctx}${a.compactions ? ` · compacted ${a.compactions}×` : ""}</div>
      <div>Started</div><div>${ago(a.started)}</div>
      <div>Last report</div><div>${ago(a.last_report)}</div>
      <div>Where</div><div>${esc(a.where || a.tab_label || "?")} <button class="btn" data-focus="${esc(a.name)}">Show me</button></div>
      <div>Folder</div><div>${esc(a.cwd || "")}</div>
    </div>
    ${a.kind === "leadfarmer" ? `<div><div class="label">Your conversation${a.unread_reports ? ` · ${a.unread_reports} unread report(s) from farmers` : ""}</div>
        <div class="box chat">${(a.conversation || []).length ? a.conversation.map(m => `<div class="msg ${m.from === "you" ? "you" : "them"}">
          <small>${m.from === "you" ? "you" : "lead farmer"}${m.ts ? " · " + new Date(m.ts).toLocaleTimeString() : ""}</small>${esc(m.text)}</div>`).join("")
          : `<span class="label">No messages yet.</span>`}</div></div>` : ""}
    ${a.last_report_text && a.kind !== "leadfarmer" ? `<div><div class="label">Last report</div><div class="box">${esc(a.last_report_text)}</div></div>` : ""}
    <${a.kind === "leadfarmer" ? "details class=\"screenbox\"" : "div"}>${a.kind === "leadfarmer" ? "<summary class=\"label\">Live screen (everything, including reports)</summary>" : "<div class=\"label\">Live screen</div>"}
      <div class="box"><pre class="screen">${esc(a.screen || "(no screen)")}</pre></div></${a.kind === "leadfarmer" ? "details" : "div"}>`;
  const pre = content.querySelector("pre.screen");
  const chat = content.querySelector(".chat");
  if (chat) chat.scrollTop = sameAgent && !chatAtBottom ? chatTop : chat.scrollHeight;
  if (sameAgent) {
    content.scrollTop = contentTop;
    pre.scrollTop = atBottom ? pre.scrollHeight : preTop;  // follow new output only if already at the bottom
  } else {
    pre.scrollTop = pre.scrollHeight;  // a new agent opens at its latest output, like a terminal
  }
}
function goTo(target) {
  const el = target === "needs" ? document.getElementById("needs")
    : [...document.querySelectorAll(".who")].find(w => w.querySelector(".mail"));
  if (!el) return;
  el.scrollIntoView({ behavior: "smooth", block: "center" });
  el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
}
function closeDetail() {
  openName = null; clearInterval(detailTimer); document.getElementById("drawer").classList.remove("open");
  const c = document.getElementById("d-content"); c.dataset.name = ""; c.dataset.sig = "";
}
document.addEventListener("click", e => {
  // a click outside the drawer closes it (clicking another farmer or animal switches to them)
  if (openName && !e.target.closest("#drawer") && !e.target.closest(".who")) closeDetail();
  const g = e.target.closest("[data-goto]"); if (g) { goTo(g.dataset.goto); return; }
  const f = e.target.closest("[data-focus]"); if (f) { e.stopPropagation(); focusAgent(f.dataset.focus); return; }
  const b = e.target.closest(".who"); if (b) openDetail(b.dataset.name);
});
document.getElementById("notify").addEventListener("click", async () => {
  if (!("Notification" in window)) { alert("This browser does not support notifications."); return; }
  if (localStorageGet("farm-notify") === "on") { localStorageSet("farm-notify", "off"); paintNotifyButton(); return; }
  const p = await Notification.requestPermission();
  localStorageSet("farm-notify", p === "granted" ? "on" : "off"); paintNotifyButton();
});
paintNotifyButton();
document.getElementById("d-close").addEventListener("click", closeDetail);
document.addEventListener("keydown", e => { if (e.key === "Escape") document.getElementById("d-close").click(); });
async function refreshQuota() {
  const el = document.getElementById("quota");
  try {
    const q = await (await fetch("/api/quota", { cache: "no-store" })).json();
    if (!q.available) { el.innerHTML = ""; return; }
    if (q.unlimited) { el.innerHTML = `<div class="quota-card"><span class="what">Copilot</span><span>Premium requests are unlimited on this plan.</span><span></span></div>`; return; }
    const pct = q.percent_used ?? 0, pace = q.month_elapsed;
    const ahead = pace != null && pct > pace + 5;
    const cls = pct >= 100 ? "over" : (pct >= 80 || ahead) ? "warn" : "";
    const fmt = n => n >= 1e6 ? (n / 1e6).toFixed(n % 1e6 ? 2 : 0) + "M" : n >= 1e3 ? (n / 1e3).toFixed(1) + "k" : String(Math.round(n));
    const reset = q.reset ? new Date(q.reset).toLocaleDateString(undefined, { month: "short", day: "numeric", timeZone: "UTC" }) : "?";
    const paceText = pace == null ? "" : ahead ? ` · ahead of pace (${pace}% of the month has passed)` : ` · on pace (${pace}% of the month has passed)`;
    el.innerHTML = `<div class="quota-card" title="Copilot premium credits for this billing month">
      <span class="what">Copilot quota</span>
      <span class="qbar ${cls}"><i style="width:${Math.min(100, pct)}%"></i>${pace != null ? `<span class="pace" style="left:${pace}%" title="how much of the month has passed"></span>` : ""}</span>
      <span><b>${pct}%</b> used · ${fmt(q.used)} of ${fmt(q.entitlement)} credits</span>
      <span class="note">Resets ${esc(reset)}${paceText}${q.overage_count ? ` · ${fmt(q.overage_count)} overage credits used` : ""}${pct >= 100 ? (q.overage_permitted ? " · now in overage (billed)" : " · quota exhausted") : ""}</span>
    </div>`;
  } catch (e) { el.innerHTML = ""; }
}
refreshQuota(); setInterval(refreshQuota, 30000);
sky(); setInterval(sky, 60000);
refresh(); setInterval(refresh, 3000);
</script>
